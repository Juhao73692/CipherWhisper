name: server-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Integration tests
        run: cargo test --workspace --locked
      - name: Build servers
        run: cargo build --workspace --locked
      - name: Real-process smoke test
        run: python3 scripts/smoke.py
      - name: Single-executable HTTPS smoke test
        run: python3 scripts/smoke.py --binary target/debug/topicairn --tls
