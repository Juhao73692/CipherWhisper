name: topicairn-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/local-ui/package-lock.json
      - name: Frontend checks, rendering tests and reproducible assets
        run: |
          npm --prefix apps/local-ui ci
          npm --prefix apps/local-ui run format:check
          npm --prefix apps/local-ui run check
          npm --prefix apps/local-ui test
          npm --prefix apps/local-ui run build
          git diff --exit-code -- server/domain/ui
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Integration tests
        run: cargo test --workspace --locked
      - name: Build servers
        run: cargo build --workspace --locked
      - name: Real-process smoke test
        run: python3 scripts/smoke.py
      - name: Single-executable HTTPS smoke test
        run: python3 scripts/smoke.py --binary target/debug/topicairn --tls
      - name: Internal device encrypted-sync smoke test
        run: python3 scripts/device-smoke.py
      - name: Browser integration tests
        working-directory: apps/local-ui
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
