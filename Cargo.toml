[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "server/relay", "apps/cli", "server/domain", "apps/cipherwhisper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
hex = "0.4"
vodozemac = "=0.11.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
clap = { version = "4", features = ["derive", "env"] }
cipherwhisper-protocol = { path = "crates/protocol" }
cipherwhisper-core = { path = "crates/core" }
cipherwhisper-relay = { path = "server/relay" }
cipherwhisper-domain = { path = "server/domain" }
cipherwhisper-cli = { path = "apps/cli" }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }

[profile.release]
lto = "thin"
strip = true
